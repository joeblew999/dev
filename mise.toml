# The stack's developer tool, built and released here; `mise tasks` lists
# what this repo does. Other repos pin the release:
#   "packslip:github.com/joeblew999/dev" = "<version>"
# and get `dev` on PATH plus its skill in .claude/skills/dev.

[tools]
go = "1.27.1"
"packslip:github.com/jdx/hk" = "2.0.1"
goreleaser = "latest"
packslip = "latest"
gh = "latest"
fnox = "latest"   # the one way to a secret; dev release reads the signing key from it
"go:golang.org/x/tools/cmd/deadcode" = "latest"   # what `mise run dead` reports
# dupl is pinned where the rest of these float, because of how it is
# maintained. It was dormant from 2020-12-17 to 2026-03-04 and then, in one
# burst, added Go generics support AND changed its default threshold from 15
# to 100. `mise run dup` passes -threshold 40 explicitly, so that default
# change did not bite here — but six commits in twelve months, one of which
# silently rewrote what the tool does when you say nothing, is not a release
# stream to take sight unseen.
"go:github.com/mibk/dupl" = "v1.1.0"   # what `mise run dup` reports: the same code written twice
"go:mvdan.cc/unparam" = "latest"   # what `mise run unread` reports: a parameter the body never touches
"go:github.com/jgautheron/goconst/cmd/goconst" = "v1.11.0"   # what `mise run repeated` reports: one string written in three places
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"   # an hk step: every commit, and lint
"go:github.com/nelsonlaidev/scoutly/cmd/scoutly" = "v0.5.0"   # what `dev seo` runs: crawl and on-page
"go:github.com/raviqqe/muffet/v2" = "v2.11.5"   # dev seo: the link layer
"go:github.com/Erose112/seo-audit" = "latest"   # dev seo: the scored gate
"go:github.com/berkaycubuk/kitsune/cmd/kitsune" = "latest"   # dev seo: stable dotted ids  (note the /cmd path)
"go:github.com/jimsmart/grobotstxt/cmd/icanhasrobot" = "latest"   # dev seo: Google own robots matcher, ported
"go:github.com/meysam81/scry" = "latest"   # dev seo: the broad one, TLS and headers included
"go:github.com/kevhq/ldlint/cmd/ldlint" = "latest"   # dev seo: schema.org vocabulary
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
node = "latest"
flyctl = "latest"

# The site's own address, named once: three tasks write it into canonical
# links, a sitemap and an llms.txt, and a fourth checks the deployed thing.
# Four spellings of one URL is four chances to point at the wrong site.
[vars]
site_origin = "https://dev-docs.gedw99.workers.dev"
# The same site on the other cloud. Both are real deploys of one generator's
# output, which is the point of having them: a stack that claims a command
# runs on either has to be able to show it, and what the two serve is the
# same files with the same headers — Cloudflare reads _headers itself and
# site/fly reads the same file at startup.
site_fly_origin = "https://dev-site-fly.fly.dev"

# What the site says it is. The policy that goes with it is NOT here: it
# names the sha256 of the page's own inline stylesheet, so the generator
# writes it to site/csp.txt and the tasks read that. A hash kept in a task
# file is wrong the first time a colour changes, silently, in the browser.
site_desc = "The developer tool of the mise + fnox + hk + packslip stack."
site_title = "dev"

# What seals a test run off from the network. Every test here is meant to be
# hermetic — fixtures, stubs and httptest — and "meant to be" is not a thing
# anybody can check by reading. Prefixed to `go test` in check, so every run
# proves it at no extra cost: a test that reaches a cloud finds a dead proxy
# and fails, and localhost is excluded so httptest still works.
sealed = "HTTP_PROXY=http://127.0.0.1:1 HTTPS_PROXY=http://127.0.0.1:1 NO_PROXY=127.0.0.1,localhost"
# llms.txt comes from the command's own verbs, which only the command knows,
# and head.html is a fragment this site's generator writes itself.
site_skip = "llms,head"

[hooks]
postinstall = { task = "bootstrap" }

# mise resolves every packslip pin through the GitHub API, and unauthenticated
# that is 60 requests an hour for the whole machine — which is reached by
# installing a few tools and then looks like the release does not exist.
# gh is already logged in, so borrow its token rather than asking anyone to
# set one. dev release does the same for goreleaser.
[env]
GITHUB_TOKEN = "{{ exec(command='gh auth token 2>/dev/null || true') }}"

[settings.skills]
auto_sync = true
prune = true

# Exact packslip pins are signature-checked; the 24h wait only ever held CI.
[settings]
minimum_release_age_excludes = ["packslip:*"]

# ------------------------------------------------------------------------------
# This repo is one command at its root, so its stages take ".".
# ------------------------------------------------------------------------------

[tasks.bootstrap]
description = "After mise install: git hooks and the tool itself"
depends = ["build"]
run = "hk install"

[tasks.build]
description = "go fix, then .bin/dev, and the skill from its verbs"
# Every input go:embed compiles in, not just the Go. A file missing here
# leaves .bin/dev stale while mise reports it fresh, and `dev skill` then
# rewrites the manual from the old bytes and says it succeeded.
sources = [
  "**/*.go", "go.mod", "go.sum",
  "skill.md", "cli/*.md", "internal/*/usage.md", "packslip.pub",
]
outputs = [".bin/dev", "./dev", "skills/dev/SKILL.md", ".claude/skills/dev/SKILL.md", ".agents/skills/dev/SKILL.md"]
run = [
  # go fix first, before the compile: it rewrites old Go into modern Go, so
  # the binary and the skill below build from the fixed sources. check and
  # test both reach this through the build dependency, while lint stays a
  # read-only gate (hk check) and dead stays a report, never a gate.
  "go fix ./...",
  # dev is the one repo whose command is the tool itself, so the build lands at
  # the root as well: ./dev is how you try a change the way a person meets it,
  # without .bin/ in front of every line. .gitignore has carried /dev for this
  # all along. Every other repo reaches dev through its packslip pin, not here.
  #
  # The copy is here rather than last on purpose. `dev skill` can fail — the
  # stale guard refuses when a source changed under it — and if the copy ran
  # after, a failed skill would leave ./dev behind the build that just
  # succeeded, which is the one thing a root copy must never be.
  "go build -o .bin/dev .",
  "cp .bin/dev ./dev",
  ".bin/dev skill",
]

[tasks.dead]
description = "Code nothing reaches, so a refactor can see what it left behind"
# A report, never a gate. Dead code is normal mid-refactor and failing a build
# over it only teaches people to delete things they are about to need. But
# nothing else says it: go vet and the compiler are both silent on a function
# no one calls, exported or not, which is how an unused one sat in cli after
# the signatures stopped needing it.
#
# -test counts a test as a caller, so a helper only tests use is not reported.
run = "deadcode -test ./..."

[tasks.dup]
description = "the same code written twice, as a report"
# A report, not a gate, for the reason dead is: some repetition is the clearest
# way to say a thing, and a threshold that fails a build teaches people to
# write around the detector rather than to stop repeating themselves. What it
# is for is seeing what a change left behind.
#
# 40 tokens is about a small function; below that it finds every error check
# in the tree and says nothing.
run = "dupl -threshold 40 -plumbing $(git ls-files '*.go') || true"

[tasks.unread]
description = "parameters nothing reads, so a signature cannot promise what the body ignores"
# A report, never a gate, and most of what it says is fine: a parameter kept
# to satisfy an interface is normal, and "always receives X" is usually a
# helper still waiting for its second caller.
#
# The one kind worth reading is the other: a parameter the body never touches
# at all. That is a signature saying something the code does not do, and every
# caller threads a value through believing it. Nothing else in this gate says
# it — the compiler allows it, go vet is silent, staticcheck only reports
# unused locals, and deadcode counts the function as reached. stage.run took
# an io.Writer it never wrote to, through four callers, for exactly as long as
# nothing was looking.
run = "unparam ./... || true"

[tasks.repeated]
description = "a fact spelled out in three places, where a constant would say it once"
# A report, not a gate, because about half of what it finds is a verb's own
# name, and `dev ` + verbName reads worse than writing the word. Reading past
# that half is the price of the other one.
#
# The other half is the "a fact belongs in one place" rule, detected
# mechanically: a string in three files that all mean the same thing, or a
# literal written beside the const that already holds it. Those drift the day
# one of them is edited, which is the whole reason the rule exists.
#
# Three occurrences, not two: two is a coincidence. Tests are excluded because
# a test repeating a fixture's name on purpose is how a test stays readable.
run = "goconst -min-occurrences 3 -ignore-tests ./... || true"

[tasks.smells]
description = "every report at once: dead code, duplication, unread parameters, repeated strings"
# Four tasks of one shape, so there is one door to them. Each says what a
# change left behind; none of them fails a build, and none of them is in
# hk.pkl or in test. That is the whole distinction: lint and check are gates
# and must be green, these are reports and are read.
depends = ["dead", "dup", "unread", "repeated"]

[tasks.lint]
description = "hk checks: gofmt, vet, tidy, staticcheck, whitespace, secrets"
# What runs is hk.pkl's list, which is also what runs on commit — named in one
# place so the two can never say different things.
run = "hk check --all"

[tasks.check]
description = "tests (which hold the skill to the verbs), and a snapshot release builds and signs"
depends = ["build"]
# No vet here: hk.pkl runs it, on every commit and in lint. Running it again
# was the same check declared in two files, and test ran it twice.
run = [
  "{{ vars.sealed }} go test ./...",
  ".bin/dev release . --snapshot",
]

[tasks.test]
description = "lint, then check: the same locally and in GitHub Actions (test.yml runs exactly this)"
depends = ["lint", "check"]

[tasks.skill]
description = "Regenerate skills/dev/SKILL.md, and the copy Claude Code reads here, from the verbs' own usage"
depends = ["build"]
run = ".bin/dev skill"

[tasks."session:sync"]
description = "Write every agent's skills directory and the settings.json keys session.toml implies"
depends = ["build"]
run = ".bin/dev session sync"

[tasks."session:check"]
description = "Fail when what agents read has drifted from session.toml"
depends = ["build"]
run = ".bin/dev session check"

[tasks."session:remove"]
description = "Take back every skill sync put here, leaving this repo's own alone"
depends = ["build"]
run = ".bin/dev session remove"

[tasks."session:verify"]
description = "Hold a fresh Claude Code session against SESSION.lock"
depends = ["build"]
run = ".bin/dev session verify"

[tasks.usage]
description = "Every verb and what it does, as the binary itself prints it"
depends = ["build"]
# The binary is the manual: this is the same text `dev` prints with no verb,
# rendered from the verbs' own usage.md files. `mise run help <verb>` narrows
# it to one verb and adds that verb's flags.
run = ".bin/dev --help"

[tasks.help]
description = "What a verb takes (mise run help check): its flags, and what it is for"
depends = ["build"]
# The flags and what each one means come from the FlagSet the verb registers,
# so they cannot drift from the code; the description under them is that
# verb's own usage.md entry. Neither is a hand-kept copy of the other.
#
# A deploy verb (url, deploy, logs, smoke, delete) reads DIR before it knows
# which cloud it is talking to, and its flags differ per cloud, so those need
# a real command directory: mise run help url cmd/proxy.
usage = '''
arg "<verb>" help="the verb to explain, with its subcommand if it has one (secrets push)"
arg "[dir]" help="the command directory it would act on" default="."
'''
run = '.bin/dev "$usage_verb" "$usage_dir" --help'

[tasks.release]
description = "Publish a release, the same locally and in GitHub Actions: <version> here, the pushed tag there"
depends = ["build"]
run = ".bin/dev release ."

[tasks."release:snapshot"]
description = "Build and sign the release, publishing nothing (check runs this)"
depends = ["build"]
run = ".bin/dev release . --snapshot"

[tasks."site:build"]
description = "Render the manuals to HTML and write every file Google and a model ask for"
depends = ["build"]
sources = ["site/gen/main.go", "skills/*/SKILL.md", "README.md"]
outputs = ["site/public/index.html", "site/public/sitemap.xml", "site/public/llms.txt", "site/urls.txt", "site/csp.txt"]
# The order is the chain, and dev enforces it: llms.txt comes from the command
# itself — its verbs, which only the command knows — so `dev llms` writes that
# one and `dev seo write` is told to skip it rather than overwrite it with a
# page list. Everything else `dev seo write` produces, pulling in what each
# file it writes depends on.
run = [
  "go run ./site/gen --out site/public --origin {{ vars.site_origin }}",
  ".bin/dev llms site/public --origin {{ vars.site_origin }}",
  ".bin/dev seo write site/public",
]
# A task's env replaces [env] rather than adding to it, so everything dev
# reads is named here — the values come from [vars], which is the one place
# any of them is written.
env = { DEV_URL = "{{ vars.site_origin }}/", DEV_URLS = "site/urls.txt", DEV_CSP = "{{ exec(command='cat site/csp.txt 2>/dev/null || true') }}", DEV_TITLE = "{{ vars.site_title }}", DEV_DESC = "{{ vars.site_desc }}", DEV_SKIP = "{{ vars.site_skip }}" }

[tasks."site:run"]
description = "Serve the site here, the way Cloudflare will: the same files, no deploy"
depends = ["site:build"]
# Through dev, so what runs locally is what deploys — the alternative is a
# second server that agrees until the day it does not.
run = ".bin/dev run site"

[tasks."site:cf:deploy"]
description = "Put the site on Cloudflare, from the working tree: no commit, no release"
depends = ["site:build"]
run = ".bin/dev deploy site"

[tasks."site:cf:check"]
description = "Run every SEO checker against the deployed site, which is the only thing Google sees"
depends = ["build"]
# Against the URL and not the directory on purpose: what Search reads is what
# the edge serves, headers and all, not what the source says it will.
run = ".bin/dev seo check {{ vars.site_origin }}/ --record .reports/site"

[tasks."site:evolve"]
description = "Check the live site, write the files that fix what was found, deploy, and check again"
depends = ["build"]
# The loop dev already knew how to describe and stopped short of running:
# every finding carries the writer whose artifact resolves it, so the report
# chooses what to write. Nothing here decides what is wrong — the checkers
# did, against the deployed site, which is the only thing Google sees.
#
# It ends with a second check rather than a claim, because "fixed" is a thing
# the site says, not a thing this says about the site.
run = [
  ".bin/dev seo check {{ vars.site_origin }}/ --fix site/public",
  ".bin/dev deploy site",
  ".bin/dev seo check {{ vars.site_origin }}/ --record .reports/site",
]

[tasks."site:evolve:agent"]
description = "Hand the findings mise cannot fix to Claude Code, which changes dev until it can"
# build before, so the agent reads a manual rendered from the code as it is
# now — .claude/skills/dev/SKILL.md is what Claude Code loads when mise starts
# it here, and a stale one briefs it on verbs that have changed.
depends = ["build"]
# And build again after, because the agent's whole job is to change the code
# the manual is rendered from. Without this the loop degrades every time it
# succeeds: run one edits a verb, run two is briefed on the verb as it was,
# and the drift compounds silently because nothing reads SKILL.md but the
# next agent.
#
# build has sources and outputs, so when the agent changed nothing this costs
# a stat of each file and skips. mise is doing the work the Makefile would
# have; depends_post is how it knows to do it afterwards rather than before.
#
# session:check last, and it is the half that is easy to get wrong. Claude
# Code reads skills when it starts and does not watch them, so regenerating
# SKILL.md reaches the next `claude -p` — which mise starts fresh every run,
# so the loop itself is fine — and does not reach a session already open.
# session:check compares each running session's start time against the
# skills' newest mtime and names the ones now briefed on a manual that has
# moved. Without it the loop is correct and every human and agent watching it
# is quietly reading the previous version.
depends_post = ["build", "skill:check", "session:check"]
# The loop above closes what dev already knows how to close. What survives it
# is, by construction, what no writer claims — and every one of those is a
# question about dev itself: a writer that should exist, a validator that
# could have caught it before the deploy, a Fixes prefix pointing nowhere.
# Answering that is a code change, so the thing that answers it is an agent
# with the repo in front of it.
#
# The brief is site/evolve.md, beside the code it is about, for the same
# reason every other manual here is: a prompt kept in a task is a prompt
# nobody reads and nobody edits.
#
# It refuses on a dirty tree, and that is the whole safety net. AGENTS.md's
# first rule about refactoring is to commit green before starting, because
# `git checkout --` is what has saved this repo every time a refactor went
# wrong. An agent editing over uncommitted work takes that away, so it does
# not get to start. It also never commits and never deploys a red tree; both
# are in the brief, and the clean tree is what makes them recoverable if it
# ignores them.
run = [
  # dev knows what installs Claude Code, and it is the one tool in the
  # registry mise cannot fetch, so the answer is a sentence rather than a pin.
  "command -v claude >/dev/null || { .bin/dev tools --missing | grep claude; exit 1; }",
  "git diff --quiet && git diff --cached --quiet || { echo 'the tree is dirty; commit or stash first — a clean tree is the only way back from an agent that goes wrong' >&2; exit 1; }",
  "claude -p \"$(cat site/evolve.md)\" --permission-mode acceptEdits --allowed-tools Bash Read Edit Write Glob Grep --model claude-opus-5",
]

[tasks."site:evolve:all"]
description = "The whole loop: fix what dev can, change dev for what it cannot, then prove it"
# Three passes, and the order is the argument.
#
# The mechanical pass first, because it is free and it closes everything dev
# already knows how to close. What survives it is not a list of faults — it
# is the list of things dev has no answer for, which is exactly the brief an
# agent needs and could not have been written by hand.
#
# Then the agent, which changes dev rather than the site.
#
# Then the mechanical pass again, which is the only honest way to know the
# code change worked: it runs the new writer against the live site and says
# what is left. A run that ends by asserting success would be the report
# contradicting the site, which this tree has done enough times today.
run = [
  "mise run site:evolve",
  "mise run site:evolve:agent",
  "mise run site:evolve",
]

[tasks."skill:check"]
description = "Fail when any copy of the manual is behind the verbs it is rendered from"
# The guard that makes depends_post worth having rather than merely present.
# `dev skill` rewriting the file is not proof the file is right: the binary
# it rendered from could itself be stale. --check reads every copy against
# what the verbs say now and names whichever is behind.
#
# A gate rather than a report, and the one exception to this file's habit of
# ending a report with `|| true`: a manual that disagrees with the binary is
# not a smell, it is the tool lying to the next agent that reads it.
run = ".bin/dev skill --check"

[tasks."site:fly:build"]
description = "Render the same site into the Fly image's directory"
depends = ["build"]
sources = ["site/gen/main.go", "skills/*/SKILL.md", "README.md"]
outputs = ["site/fly/public/index.html", "site/fly/public/sitemap.xml", "site/fly/public/llms.txt"]
# The same three steps site:build runs, against the other origin. Not a copy
# of site/public: a canonical link, a sitemap and an llms.txt all name the
# site they are on, so the two differ in the only way they should.
run = [
  "go run ./site/gen --out site/fly/public --origin {{ vars.site_fly_origin }} --urls site/fly/urls.txt --csp site/fly/csp.txt",
  ".bin/dev llms site/fly/public --origin {{ vars.site_fly_origin }}",
  ".bin/dev seo write site/fly/public",
]
env = { DEV_URL = "{{ vars.site_fly_origin }}/", DEV_URLS = "site/fly/urls.txt", DEV_CSP = "{{ exec(command='cat site/fly/csp.txt 2>/dev/null || true') }}", DEV_TITLE = "{{ vars.site_title }}", DEV_DESC = "{{ vars.site_desc }}", DEV_SKIP = "{{ vars.site_skip }}" }

[tasks."site:fly:deploy"]
description = "Put the site on Fly, from the working tree: no commit, no release"
depends = ["site:fly:build"]
run = ".bin/dev deploy site/fly"

[tasks."site:fly:check"]
description = "Run every SEO checker against the Fly deploy"
depends = ["build"]
run = ".bin/dev seo check {{ vars.site_fly_origin }}/ --record .reports/site-fly"


[tasks."site:deploy"]
description = "Deploy the same site to BOTH clouds and print both URLs"
# Both, always, and that is the point rather than a convenience. This repo's
# whole claim is that a command on this stack runs on either cloud, and a
# claim only one of them is ever tested against is a claim nobody is
# checking. Deploying both every time is what keeps it honest.
depends = ["site:cf:deploy", "site:fly:deploy"]
run = "mise run site:health"

[tasks."site:health"]
description = "What both deploys answer, and the headers they answer with"
depends = ["build"]
# One verb, both clouds, because what a deploy answers is a fact about an
# HTTP address and the registry already knows how each cloud names its own.
# Printed side by side because the interesting thing is whether they agree:
# the two serve the same files from one _headers, and the only way to know
# they still do is to ask both.
run = [
  ".bin/dev health site --deployed",
  ".bin/dev health site/fly --deployed",
]

[tasks."site:undeploy"]
description = "Take the site off both clouds"
depends = ["build"]
# The other half of deploy, and worth having for the reason every reconcile
# has an establish beside it: a thing you cannot remove is a thing you will
# hesitate to put up. --yes because a task is not a prompt.
run = [
  ".bin/dev delete site --yes",
  ".bin/dev delete site/fly --yes",
]
