name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write       # Upload the packslip bundle.
  id-token: write       # Sign the packslip with the workflow's identity.
  attestations: write   # Publish provenance for the matched files.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v4.3.0

      # The same task a developer runs; the workflow only supplies the
      # signing identity packslip needs.
      - name: Build, sign, publish
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same signing key a local release uses (dev release --keygen
          # sets it), so consumers pin one public key. Unset: the workflow's
          # own identity signs instead.
          PACKSLIP_SIGNING_KEY: ${{ secrets.PACKSLIP_SIGNING_KEY }}
