name: Test

# Proves the tool builds and tests on a machine nobody set up.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Every tool comes from mise.toml; postinstall builds .bin/dev.
      - name: Install mise and every tool
        uses: jdx/mise-action@v4.3.0

      - name: Test
        run: mise run test
